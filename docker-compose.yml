x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-socuser}:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/${POSTGRES_DB:-socdb}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  AGENT_HEALTH_PORT: "8080"

x-agent-healthcheck: &agent-healthcheck
  test:
    - CMD
    - python
    - -c
    - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
  interval: 10s
  timeout: 4s
  retries: 12
  start_period: 20s

services:
  postgres:
    image: postgres:15.17-bookworm@sha256:32016c79bea24c14917660106bc23a03341d94b9983aeb41f4130b4f3fbd6dd0
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-socdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.9-alpine@sha256:3e1b24a1a8f24ff926b15e5ace8c38a03e5657fb66e1fc7e5188e315aa5fa094
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: mntr,srvr,ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 10s
      timeout: 8s
      retries: 15

  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r9
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        topics=(
          soc_logs
          soc_alerts
          investigated_alerts
          threat_enriched_alerts
          remediation_actions
        )
        for topic in "$${topics[@]}"; do
          kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions 1 \
            --replication-factor 1
        done
        kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  migrate:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-environment
    restart: "no"

  backend:
    build:
      context: .
      target: runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PIPELINE_HEALTH_URLS: detection=http://detection-agent:8080/health/ready,investigation=http://investigation-agent:8080/health/ready,threat_intel=http://threat-intel-agent:8080/health/ready,remediation=http://remediation-agent:8080/health/ready,reporting=http://reporting-agent:8080/health/ready
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 7s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  detection-agent:
    build:
      context: .
      target: runtime
    command: ["python", "agents/detection_agent.py"]
    expose: ["8080"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      DETECTION_MODE: ${DETECTION_MODE:-rule_based}
      ANOMALY_MODEL_BUNDLE: ${ANOMALY_MODEL_BUNDLE:-/app/ml/models/anomaly_bundle.joblib}
    healthcheck: *agent-healthcheck
    restart: unless-stopped

  investigation-agent:
    build:
      context: .
      target: sequence-runtime
    command: ["python", "agents/investigation_agent.py"]
    expose: ["8080"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
      SEQUENCE_PREDICTION_MODE: ${SEQUENCE_PREDICTION_MODE:-optional}
      SEQUENCE_ARTIFACT_DIR: ${SEQUENCE_ARTIFACT_DIR:-/app/ml/sequence_detection}
      SEQUENCE_STATE_TTL_SECONDS: ${SEQUENCE_STATE_TTL_SECONDS:-3600}
    healthcheck: *agent-healthcheck
    restart: unless-stopped

  threat-intel-agent:
    build:
      context: .
      target: runtime
    command: ["python", "agents/threat_intel_agent.py"]
    expose: ["8080"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    healthcheck: *agent-healthcheck
    restart: unless-stopped

  remediation-agent:
    build:
      context: .
      target: runtime
    command: ["python", "agents/remediation_agent.py"]
    expose: ["8080"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    volumes:
      - soc_logs:/app/logs
    healthcheck: *agent-healthcheck
    restart: unless-stopped

  reporting-agent:
    build:
      context: .
      target: runtime
    command: ["python", "agents/reporting_agent.py"]
    expose: ["8080"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
    volumes:
      - soc_logs:/app/logs
    healthcheck: *agent-healthcheck
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/live-alerts}
    ports:
      - "${FRONTEND_PORT:-5173}:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  ml-training:
    profiles: ["training"]
    build:
      context: .
      target: training
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      <<: *app-environment

volumes:
  postgres_data:
  soc_logs:
