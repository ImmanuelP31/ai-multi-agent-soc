services:
  detection-agent:
    environment:
      DETECTION_MODE: rule_based

  integration-test:
    build:
      context: .
      target: test
    profiles: ["test"]
    depends_on:
      detection-agent:
        condition: service_healthy
      investigation-agent:
        condition: service_healthy
      threat-intel-agent:
        condition: service_healthy
      remediation-agent:
        condition: service_healthy
      reporting-agent:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-socuser}:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/${POSTGRES_DB:-socdb}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PIPELINE_TIMEOUT_SECONDS: "60"
      RUN_INTEGRATION: "1"
    volumes:
      - soc_logs:/app/logs
    command:
      - python
      - -m
      - pytest
      - -p
      - no:cacheprovider
      - -m
      - integration
      - tests/integration
      - -v
